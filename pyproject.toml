[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rofoul"
version = "1.0.0"
description = "Early-warning model for RO membrane fouling: normalization, fouling forecast and days-to-clean (CLI + REST API)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25", "matplotlib>=3.7"]

[project.scripts]
rofoul = "rofoul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rofoul = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
